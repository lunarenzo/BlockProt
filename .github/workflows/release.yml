name: Release

on: [workflow_dispatch]

jobs:
  release_build:
    runs-on: ubuntu-latest
    
    # Allows the workflow to create a Release tab and upload files
    permissions:
      contents: write

    container:
      image: eclipse-temurin:17-jdk
      options: --user root

    steps:
      - name: Install System Git
        run: apt-get update && apt-get install git -y && git --version

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # FIXED: This dynamic path adapts perfectly to your custom fork directory layout
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}

      - name: Generate Changelog Entries
        uses: FabricMC/fabric-action-scripts@v2
        id: changelog
        with:
          context: changelog
          workflow_id: release.yml
          commit_regex: (Bump|Codechange|[a-zA-Z].* \[GH\]:|Build\(deps\))(.*)

      # FIXED: Changed out-of-date 'adopt' distribution target over to 'temurin'
      - name: Initialize JDK 17 Environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle Infrastructure
        uses: gradle/wrapper-validation-action@v2

      - name: Execute Project Build Script
        run: ./gradlew build github --stacktrace
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}

      # FIXED: Widened the selection filter to ensure your blockprot-spigot-all.jar is compiled and caught
      - name: Archive Local Artifact Output
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            **/build/libs/*.jar
            !common/**
